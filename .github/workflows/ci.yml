name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aacfl
          POSTGRES_PASSWORD: aacfl
          POSTGRES_DB: aacfl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aacfl -d aacfl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://aacfl:aacfl@localhost:5432/aacfl_test?schema=public
      AUTH_SECRET: test-secret-value-with-at-least-32-chars
      LOG_LEVEL: info
      TEST_ENV: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:format
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U aacfl -d aacfl_test; do sleep 2; done
      - run: npm run prisma:migrate:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npm run test:component
      - run: npm run db:seed
      - name: Verify Playwright seed data
        run: npx tsx scripts/verify-e2e-seed.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run security:audit
